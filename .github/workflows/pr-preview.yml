name: PRプレビュー

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール
        if: github.event.action != 'closed'
        run: npm ci

      - name: ビルド（PRプレビュー用パス）
        if: github.event.action != 'closed'
        run: npm run build
        env:
          VITE_BASE_URL: /task-list/pr-${{ github.event.pull_request.number }}/

      - name: PRプレビューのデプロイ・削除
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          umbrella-dir: '.'
